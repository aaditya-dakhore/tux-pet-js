<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: "Tux & Friends - a Neko.js fork" }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header class="site-header">
            <div class="header-content">
                <h1 class="site-title">🐧 Tux & Friends</h1>
            </div>
            <p class="tagline">pick your desktop pet</p>
        </header>

        <main class="content">
            {{ content }}
        </main>

        <footer class="site-footer">
            <div class="footer-divider"></div>
            <p>a fork of <a href="https://github.com/louisabraham/nekojs">Neko.js</a> by
                <a href="https://github.com/louisabraham">Louis Abraham</a> • original Neko by Masayuki Koba •
                mascot fork by <a href="https://github.com/aaditya-dakhore">Aaditya Dakhore</a></p>
        </footer>
    </div>
</body>
</html>
